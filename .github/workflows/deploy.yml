name: Deploy HTML CSS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Déployer le projet
        run: |
          echo "Début du déploiement..."
          rsync -av --delete --exclude='.git/' ./ /opt/projects/testGitAction/
          echo "Déploiement terminé."